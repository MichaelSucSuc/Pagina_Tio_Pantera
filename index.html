<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐆 TÍO PANTHERA AQP | Night Club</title>

  <!-- Meta Tags SEO & Open Graph -->
  <meta name="description" content="Tío Panthera AQP - Universitarias AQP · Comunidad. La noche empieza aquí. Únete a la experiencia nightclub cyberpunk más exclusiva.">
  <meta name="keywords" content="Tio Panthera, Universitarias AQP, Nightclub, Discoteca Arequipa, Cyberpunk, Fiesta, Telegram">
  <meta name="author" content="Tío Panthera AQP">
  <meta name="theme-color" content="#0a0a0f">

  <meta property="og:type" content="website">
  <meta property="og:title" content="🐆 TÍO PANTHERA AQP | Night Club">
  <meta property="og:description" content="Universitarias AQP · Comunidad. La noche empieza aquí. Night Mode ON.">
  <meta property="og:image" content="ImagesYLogos/Pantera%20con%20celular%20cool.jpg">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="🐆 TÍO PANTHERA AQP | Night Club">
  <meta property="twitter:description" content="Universitarias AQP · Comunidad. La noche empieza aquí.">

  <!-- Favicon Emoji 🐆 Data URI -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐆</text></svg>">

  <!-- Google Fonts: Orbitron (Títulos) & Rajdhani (Cuerpo y detalles) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Estilos Separados -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="club-beat-pulse">

  <!-- Preloader con Logo Oficial -->
  <div id="preloader">
    <div class="loader-ring">
      <img src="ImagesYLogos/Pantera%20con%20celular%20cool.jpg" alt="Tío Panthera AQP" class="loader-img">
    </div>
    <div class="loader-text">NIGHT MODE INITIALIZING...</div>
  </div>

  <!-- ==========================================================================
       EFECTOS AMBIENTALES DE FONDO
       ========================================================================== -->
  <!-- Degradado dinámico espacial -->
  <div class="bg-gradient-universe" aria-hidden="true"></div>

  <!-- Luces / Haces de discoteca girando -->
  <div class="disco-spotlights" aria-hidden="true"></div>

  <!-- Rejilla synthwave en perspectiva al infinito -->
  <div class="grid-horizon" aria-hidden="true"></div>

  <!-- Canvas para partículas flotantes neón -->
  <canvas id="particlesCanvas" aria-hidden="true"></canvas>

  <!-- Efecto de líneas scanline CRT retro-futurista -->
  <div class="scanlines-overlay" aria-hidden="true"></div>

  <!-- Puntero láser / Cursor custom para desktop -->
  <div class="cursor-glow" id="customCursor" aria-hidden="true"></div>

  <!-- ==========================================================================
       CONTENIDO PRINCIPAL (SPA LINKTREE)
       ========================================================================== -->
  <div class="app-viewport">
    <main class="main-card">

      <!-- 1) AVATAR / LOGO CENTRADO CON EFECTOS -->
      <section class="avatar-wrapper" aria-label="Logo Tío Panthera">
        <div class="avatar-aura"></div>
        <div class="avatar-border">
          <div class="avatar-inner">
            <img src="ImagesYLogos/Pantera%20con%20celular%20cool.jpg" alt="Tío Panthera AQP" class="avatar-img">
          </div>
        </div>
        <!-- Indicador de audio / beat activo -->
        <div class="live-sound-badge" title="Beat Audio Engine Active">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </div>
      </section>

      <!-- 2) IDENTIDAD: NOMBRE, SUBTÍTULO, LÍNEA LUMINOSA & BADGE -->
      <section class="identity-section">
        <h1 class="brand-title" id="glitchTitle" data-text="TÍO PANTHERA AQP">
          TÍO PANTHERA AQP
        </h1>
        <p class="brand-subtitle">UNIVERSITARIAS AQP · COMUNIDAD</p>
        
        <!-- Línea luminosa decorativa -->
        <div class="neon-divider" aria-hidden="true"></div>

        <!-- Tagline & Badge de Estado -->
        <div class="badge-tagline-group">
          <span class="tagline-text">"La noche empieza aquí"</span>
          <div class="night-badge">
            <span class="badge-dot"></span>
            <span>NIGHT MODE ON</span>
          </div>
        </div>
      </section>

      <!-- 3) BOTÓN PRINCIPAL PROTAGONISTA: TELEGRAM -->
      <section class="action-container">
        <a href="https://t.me/Universitarias_AQP_18" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="btn-telegram" 
           id="mainTelegramBtn"
           aria-label="Únete al grupo exclusivo de Telegram">
          <span class="btn-badge-vip">EXCLUSIVE VIP</span>
          <i class="fa-brands fa-telegram btn-icon" aria-hidden="true"></i>
          <span class="btn-text">ÚNETE AL GRUPO DE TELEGRAM</span>
        </a>
      </section>

      <!-- 4) SEPARADOR LUMINOSO "SÍGUENOS" -->
      <div class="separator-container" aria-hidden="true">
        <div class="separator-line"></div>
        <span class="separator-text">— SÍGUENOS —</span>
        <div class="separator-line right"></div>
      </div>

      <!-- 5) REDES SOCIALES (3 ICONOS CIRCULARES CON SU RESPECTIVO GLOW) -->
      <section class="socials-container" aria-label="Redes Sociales Oficiales">
        
        <!-- FACEBOOK -->
        <div class="social-item">
          <a href="https://www.facebook.com/share/1By9cea6iL/" 
             target="_blank" 
             rel="noopener noreferrer" 
             class="social-btn facebook" 
             aria-label="Facebook Tío Panthera AQP">
            <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
          </a>
          <span class="social-label label-fb">Facebook</span>
        </div>

        <!-- TIKTOK -->
        <div class="social-item">
          <a href="https://www.tiktok.com/@tiopanthera.aqp" 
             target="_blank" 
             rel="noopener noreferrer" 
             class="social-btn tiktok" 
             aria-label="TikTok Tío Panthera AQP">
            <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
          </a>
          <span class="social-label label-tt">TikTok</span>
        </div>

        <!-- INSTAGRAM -->
        <div class="social-item">
          <a href="https://www.instagram.com/tio_panthera_aqp" 
             target="_blank" 
             rel="noopener noreferrer" 
             class="social-btn instagram" 
             aria-label="Instagram Tío Panthera AQP">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
          </a>
          <span class="social-label label-ig">Instagram</span>
        </div>

      </section>

      <!-- 6) FOOTER OFICIAL -->
      <footer class="club-footer">
        © 2026 TÍO PANTHERA AQP · <span>NIGHT EDITION</span>
      </footer>

    </main>
  </div>

  <!-- Script Modular Separado -->
  <script src="script.js"></script>
</body>
</html>
